openapi: 3.1.0
info:
    title: EduFlow
    version: 0.1.0
    description: |
        EduFlow is a role-based education and workshop management backend API designed for Admin, Institutional Admin, Educator, Student, and Public users.

        The system supports the complete academic lifecycle including authentication, content delivery, assessments, certification, analytics, communication, and AI-powered features.

        #### Core capabilities include:

        - **Secure JWT-based authentication** and role-based access control for admin, institutional admin, educator, and student users.
        - **Institution and workshop administration**, including workshop creation, updates, enrollment tracking, assignments, and lifecycle management.
        - **Centralized content management** for modules, study materials, and learning resources uploaded by educators and accessed by students.
        - **Assessment management** for quizzes, tests, and assignments, including question creation, student attempts, answer submission, and result storage.
        - **Automated evaluation support** for objective assessments to reduce manual grading effort and improve consistency.
        - **Certificate generation** for successful workshop completion and public certificate verification using unique verification codes or identifiers.
        - **Performance tracking and reporting** for student progress, workshop statistics, assessment outcomes, completion rates, and trend analysis.
        - **Notification and communication workflows** for assessments, results, workshop updates, monthly reports, and parent/student outreach.
        - **AI-assisted reporting and explanation features** for admin-facing insights and student-facing learning support.
        - **Public verification access** for certificate authenticity checks without requiring login.

        ----------------------------------------------------------------------

        ### API MODULE DESCRIPTIONS

        #### 1. Authentication APIs
        Handles secure login, token refresh, and password management.
        Enables role-based access control across Admin, Educator, and Student.
        Ensures only authorized users access protected resources.

        #### 2. Institution & User Management APIs
        Allows Admins to manage institutions, users, roles, and associations.
        Supports onboarding, updates, and administrative controls.

        #### 3. Workshop & Module APIs
        Enables creation and management of workshops and modules.
        Supports structuring of courses and learning flows.

        #### 4. Content / Materials APIs
        Allows educators to upload and manage study materials.
        Students can access structured learning resources.

        #### 5. Assessment APIs
        Enables educators to create assessments and questions.
        Students can attempt assessments and submit answers.
        System supports automatic evaluation for objective questions.

        #### 6. Submission & Evaluation APIs
        Handles answer submission, grading, and performance computation.
        Stores results and supports leaderboard/analytics views.

        #### 7. Certificate APIs
        Generates certificates for completed workshops.
        Supports public certificate verification using unique identifiers.

        #### 8. Analytics & Reporting APIs
        Provides performance insights, dashboards, and trends.
        Includes AI-powered admin reports for actionable insights.

        #### 9. Notification & Communication APIs
        Allows admins to send notifications to students and parents.
        Supports communication workflows and alerts.

        #### 10. AI Feature APIs
        - Admin AI Reports: structured insights from analytics
        - Student Explanation: explanation for incorrect answers
        Uses structured LLM output with validation and persistence.

        ----------------------------------------------------------------------

        ### ERROR HANDLING

        All APIs follow standardized HTTP error responses:

        - **400 Bad Request** → Invalid request payload or missing parameters
        - **401 Unauthorized** → Missing or invalid authentication token
        - **403 Forbidden** → Role or permission violation
        - **404 Not Found** → Resource not found or out of scope
        - **409 Conflict** → Duplicate or conflicting operation
        - **422 Unprocessable Entity** → Validation/schema error
        - **429 Too Many Requests** → Rate limit exceeded
        - **500 Internal Server Error** → Unexpected backend failure
        - **502 Bad Gateway** → External AI/LLM failure
        - **503 Service Unavailable** → Temporary service outage

        ----------------------------------------------------------------------

        ### USER STORY MAPPING (WITH API PATHS)

        | API Module | Key API Paths | User Stories |
        |-----------|--------------|--------------|
        | **Authentication** | /auth/login, /auth/refresh, /auth/forgot-password | US1, US2 |
        | **Content Management** | /modules, /modules/{id}/materials | US3, US4 |
        | **Assessment Management** | /assessments, /questions, /tests | US5, US6, US7 |
        | **Certificate Management** | /certificates, /certificates/verify | US8, US9 |
        | **Performance & Analytics** | /analytics, /reports, /leaderboard | US10, US11, US12 |
        | **Notifications** | /notifications, /communication/parents | US13 |
        | **Reporting (AI + Monthly)** | /ai/reports, /analytics/reports | US14 |
        | **Student AI Explanation** | /ai/student-explanations | Supports US11 |

        ----------------------------------------------------------------------

        ### USER STORIES REFERENCE

        - **US1**: Role-based login for Admin
        - **US2**: Role-based login for Educator
        - **US3**: Content upload by Educator
        - **US4**: Content access by Student
        - **US5**: Assessment creation by Educator
        - **US6**: Assessment attempt by Student
        - **US7**: Automatic assessment evaluation
        - **US8**: Certificate generation
        - **US9**: Certificate verification
        - **US10**: Performance tracking (Admin)
        - **US11**: Performance viewing (Student)
        - **US12**: Statistics tracking (Admin)
        - **US13**: Notification to students/parents
        - **US14**: Monthly report generation

        ----------------------------------------------------------------------

        ### SYSTEM BEHAVIOR NOTES

        - All protected APIs enforce JWT-based authentication.
        - Role-based authorization is strictly enforced.
        - Institution-level scoping is applied for institutional admins.
        - AI responses are validated, structured, and persisted.
        - Raw AI outputs are not exposed to frontend clients.
        - Rate limiting is applied for sensitive and AI endpoints.

        ----------------------------------------------------------------------

        #### API behavior notes

        - Request validation is enforced at the schema layer before business logic execution.
        - Role checks and tenant-scoping rules are enforced on protected endpoints.
        - AI-generated results are stored with both raw and structured outputs when applicable.
        - Response payloads are designed to remain stable and renderable in client applications.
        - Public verification and read-only endpoints expose only the minimum required data.

        ----------------------------------------------------------------------


        _This specification represents the current backend implementation and API contracts of the EduFlow platform._

